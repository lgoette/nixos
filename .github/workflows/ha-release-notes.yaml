name: HA Release Notes

on:
  pull_request:
    paths:
      - 'modules/home-assistant/Dockerfile'

jobs:
  post-release-notes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get versions
        id: versions
        run: |
          NEW=$(grep '^FROM' modules/home-assistant/Dockerfile | grep -oP '\d{4}\.\d+\.\d+')
          OLD=$(git show origin/${{ github.base_ref }}:modules/home-assistant/Dockerfile | grep '^FROM' | grep -oP '\d{4}\.\d+\.\d+')
          echo "old=$OLD" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT

      - name: Fetch HA release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh api repos/home-assistant/core/releases/tags/${{ steps.versions.outputs.new }} --jq '.body // ""')
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v9
        env:
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
          OLD_VERSION: ${{ steps.versions.outputs.old }}
          NEW_VERSION: ${{ steps.versions.outputs.new }}
        with:
          script: |
            const oldV = process.env.OLD_VERSION;
            const newV = process.env.NEW_VERSION;
            const body = process.env.RELEASE_BODY;

            const comment = [
              `## 🏠 Home Assistant \`${oldV}\` → \`${newV}\``,
              '',
              body || '_Keine Release Notes gefunden._',
              '',
              `[Release Notes auf GitHub](https://github.com/home-assistant/core/releases/tag/${newV})`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
